services:
  localstack:
    container_name: localstack
    # 4.14.0 é a última versão Community que roda sem auth token.
    # A partir de 2026.x a imagem exige LOCALSTACK_AUTH_TOKEN (conta em app.localstack.cloud).
    image: localstack/localstack:${LOCALSTACK_VERSION:-4.14.0}
    ports:
      - "127.0.0.1:4566:4566"            # endpoint unificado de todos os serviços
      - "127.0.0.1:4510-4559:4510-4559"  # portas específicas por serviço
    environment:
      - DEBUG=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./volume:/var/lib/localstack
      # necessário para o LocalStack criar os containers que executam a Lambda
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 20

  web:
    build: ./app
    container_name: galeria-web
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # o app fala com o LocalStack pelo nome do serviço na rede do compose
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      localstack:
        condition: service_healthy
